version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws --version
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 272115513292.dkr.ecr.us-east-1.amazonaws.com
      - REPOSITORY_URI=272115513292.dkr.ecr.us-east-1.amazonaws.com/nodejs-server-demo-private
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build -t nodejs-server-demo-private .
      - docker tag nodejs-server-demo-private:latest 272115513292.dkr.ecr.us-east-1.amazonaws.com/nodejs-server-demo-private:latest
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker images...
      - docker push 272115513292.dkr.ecr.us-east-1.amazonaws.com/nodejs-server-demo-private:latest
      - echo Writing image definitions file...
      - printf '[{"name":"%s","imageUri":"%s"}]' $CONTAINER_NAME $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json

artifacts:
    files: imagedefinitions.json
